[project]
name = "mcp-chat-tester"
version = "0.1.0"
description = "Google-authenticated chat client for the fastmcp-rag-timer MCP server."
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.3",
    "fastapi>=0.115",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "mcp>=1.30,<2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_chat"]

[tool.hatch.build.targets.wheel.force-include]
"src/mcp_chat/web/index.html" = "mcp_chat/web/index.html"
"src/mcp_chat/web/static/app.js" = "mcp_chat/web/static/app.js"
"src/mcp_chat/web/static/styles.css" = "mcp_chat/web/static/styles.css"

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
